name: comic_reader
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.4.0+13

environment:
  sdk: ^3.11.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.5
  # Navigation
  go_router: ^15.0.0
  # Network
  dio: ^5.4.0
  # HTML parsing
  html: ^0.15.4
  # Local storage
  path_provider: ^2.1.2
  # Secure storage (Keychain/Keystore on native; encrypted localStorage fallback on web)
  flutter_secure_storage: ^9.2.2
  # Image
  cached_network_image: ^3.3.1
  extended_image: ^8.2.1
  # WebView for Cloudflare bypass
  flutter_inappwebview: ^6.0.0
  # Crypto
  pointycastle: ^3.7.4
  encrypt: ^5.0.3
  crypto: ^3.0.3
  # DI
  get_it: ^7.6.7
  # UI
  flutter_screenutil: ^5.9.0
  shimmer: ^3.0.0
  # Backup & sharing
  share_plus: ^10.1.4
  file_picker: ^8.1.7
  # Utils
  collection: ^1.18.0
  intl: ^0.19.0
  logging: ^1.2.0
  uuid: ^4.3.3
  web: ^1.1.1
  gal: ^2.3.0
  # Keep screen awake while reading (mobile only, no-op elsewhere)
  wakelock_plus: ^1.2.8
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.0
  flutter_onnxruntime: ^1.8.3
  image: ^4.8.0
  image_picker: ^1.2.3
  wasm_run: ^0.2.0
  wasm_run_flutter: ^0.2.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.3

# wasm_run_flutter (added in Task 1) bundles generated flutter_rust_bridge
# glue code codegen'd against 2.12.0 exactly, and does a strict runtime
# equality check against that version. wasm_run's own pubspec constraint
# (^2.12.0) permissively resolves to a newer compatible version (2.13.0 in
# this project's dependency graph), which fails that check at runtime. Pin
# the transitive dependency to the exact version wasm_run_flutter expects.
dependency_overrides:
  flutter_rust_bridge: 2.12.0

# wasm_run 的 native assets 构建 hook 默认是 buildMode=fetch，会在每次 native
# assets 构建时自己去 GitHub Release 下载预编译动态库。它内部用裸 HttpClient()，
# 不读 HTTPS_PROXY 也没有任何重试，一次 TLS 握手抖动就会让整个 flutter build 挂掉
# （HandshakeException: Connection terminated during handshake）。
#
# 改成 local 模式：库由 tools/prefetch_wasm_run.sh 用 curl（带重试 + sha256 校验）
# 预先下载到 native_libs/，构建过程本身完全不联网。
#
# 前置条件：构建前 native_libs/ 里必须有对应目标平台的库，否则 hook 会报
# "Could not find binary."。本机与 CI（.github/workflows/release.yml）都调用
# tools/prefetch_wasm_run.sh 来准备，native_libs/ 不入库（见 .gitignore）。
#
# localPath 末尾的斜杠是必须的：hook 在 local 模式下走 Uri.resolve(assetName)，
# 没有尾斜杠会把最后一段路径替换掉而不是进入目录。
#
# assetName 必须显式写死成 dynamic：hook 默认的资产名模板是
# `$libraryName-$libraryType-$target`，而 $libraryType 在 release 构建下会变成
# `static`（input.config.linkingEnabled 为 true 时 buildStatic 就为 true），于是它
# 会去找 wasm_run_dart-static-<target>。但上游 GitHub Release 只发布了 dynamic 产物，
# 一个 static 都没有 —— 所以 fetch 模式的 release 构建同样必挂
# （"Sha256 hash for the asset wasm_run_dart-static-... was not provided"）。
# 而 hook 里 CodeAsset 的 linkMode 是硬编码的 DynamicLoadingBundled()，LocalBuildMode
# 也总是把库输出成 dylib 文件名，static 只影响“查哪个资产名”这一步，因此把模板固定成
# dynamic 是安全的：debug 和 release 都会复用同一份 dynamic 库。
hooks:
  user_defines:
    wasm_run:
      buildMode: local
      localPath: native_libs/
      assetName: $libraryName-dynamic-$target

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
