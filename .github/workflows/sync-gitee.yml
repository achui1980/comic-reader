# Comic Reader - 同步代码到 Gitee
#
# 触发方式:
#   1. push 到 main 分支
#   2. push tag (v*)
#   3. 手动触发: Actions -> Sync to Gitee -> Run workflow
#
# 使用 git clone --mirror + git push --mirror 将 GitHub 仓库完整镜像到 Gitee,
# 分支和 tag 会与 GitHub 保持完全一致(Gitee 上本地没有的分支/tag 会被删除)。
#
# 注意:不用 actions/checkout,因为它只会把触发分支变成本地 refs/heads/*,
# 其它分支只是 refs/remotes/origin/* 追踪引用。git push --mirror 会把这些追踪引用
# 当成 hidden ref 推给 Gitee 被拒绝,同时误删 Gitee 上真实存在的其它分支。
# 直接对 GitHub 做 git clone --mirror 才能拿到与源仓库完全对应的 refs/heads/*、refs/tags/*。
#
# 前置条件(需要手动在 GitHub 仓库 Settings -> Secrets and variables -> Actions 中添加):
#   - GITEE_USERNAME: Gitee 用户名
#   - GITEE_TOKEN: Gitee 私人令牌(Gitee 个人设置 -> 私人令牌 生成,需要 projects 权限)
# 并确保 Gitee 上已存在对应仓库 https://gitee.com/achui/comic-reader

name: Sync to Gitee

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror clone from GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --mirror "https://x-access-token:${GH_TOKEN}@github.com/achui1980/comic-reader.git" repo-mirror

      - name: Mirror push to Gitee
        working-directory: repo-mirror
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git push --mirror "https://${GITEE_USERNAME}:${GITEE_TOKEN}@gitee.com/achui/comic-reader.git"
